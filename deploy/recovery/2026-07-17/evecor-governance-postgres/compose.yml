name: evecor-governance-postgres-recovery

services:
  postgres:
    container_name: evecor-governance-postgres
    image: codex-postgres:migrated-20260712
    restart: unless-stopped
    environment:
      POSTGRES_USER: governance
      POSTGRES_PASSWORD: ${GOVERNANCE_POSTGRES_PASSWORD:?inject from the approved secret source}
      POSTGRES_DB: governance
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - evecor_governance_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U governance -d governance"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  evecor_governance_pgdata:
    external: true
