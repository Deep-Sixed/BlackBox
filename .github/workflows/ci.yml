name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.5"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Pin the uv binary too, not just the action; unpinned it falls back to latest.
          version: "0.12.18"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.14.5

      - name: Run ruff
        run: uv run --frozen ruff check src tests

      - name: Run tests
        run: uv run --frozen pytest tests -q

      - name: Build distributions
        run: uv build

      - name: Installed wheel smoke
        run: uv run --frozen python tests/wheel_smoke.py dist/*.whl
