[project]
name = "blackbox"
version = "0.6.6"
description = "Evidence-first execution recorder with local SQLite durability"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
classifiers = [
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2.13,<3"]

[project.scripts]
blackbox = "blackbox.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1", "jsonschema>=4.26,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbox"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
