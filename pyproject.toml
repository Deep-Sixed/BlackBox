[project]
name = "blackbox"
version = "0.1.0"
description = "EVECOR flight-recorder software group — Ledger (claims), Recon (session evidence), Recall (derived memory)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "markdown>=3.5",
    "mcp[cli]>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
]

[project.scripts]
ledger = "ledger.cli:main"
recall = "recall.cli:main"
recon-gateway = "recon.gateway:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "anyio>=4.0",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ledger", "recon", "recall"]

[tool.ruff]
line-length = 88
target-version = "py314"
